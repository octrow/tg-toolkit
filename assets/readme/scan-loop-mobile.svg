<svg xmlns="http://www.w3.org/2000/svg" width="600" height="940" viewBox="0 0 600 940" role="img" aria-labelledby="t d">
  <title id="t">How scan_messages reads a chat</title>
  <desc id="d">The cursor becomes min_id. iter_messages walks newest-first with 1 second between requests. A FloodWaitError sleeps the seconds the server asks for and resumes the same iterator. scan_decision returns TAKE (the message goes to your mapper), SKIP (date at or after until) or STOP (date older than since, or max_scan reached).</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .bg { fill: #F3F6F9; } .card { fill: #FFFFFF; stroke: #D5DEE6; } .warn { fill: #FBEDE3; stroke: #E3B394; }
    .fg { fill: #14202B; } .muted { fill: #56677A; } .pri { fill: #1667A8; } .acc { fill: #B4470F; }
    .take { fill: #E1EEF8; } .skip { fill: #E8ECF0; } .stop { fill: #FBEDE3; }
    .ln { stroke: #1667A8; } .lnw { stroke: #B4470F; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0F161D; } .card { fill: #16202A; stroke: #2A3846; } .warn { fill: #2E2016; stroke: #6E4426; }
      .fg { fill: #E3EAF1; } .muted { fill: #98A8B8; } .pri { fill: #6CBCF2; } .acc { fill: #F29A62; }
      .take { fill: #1C3247; } .skip { fill: #212C37; } .stop { fill: #2E2016; }
      .ln { stroke: #6CBCF2; } .lnw { stroke: #F29A62; }
    }
  </style>
  <rect class="bg" width="600" height="940" rx="20"/>

  <g id="cursor">
    <rect class="card" x="30" y="30" width="540" height="120" rx="14" stroke-width="2"/>
    <text x="54" y="70" class="mono muted" font-size="19">cursor</text>
    <text x="54" y="104" class="mono fg" font-size="20">last_seen_msg_id</text>
    <text x="54" y="134" class="mono pri" font-size="20">→ min_id</text>
  </g>
  <path class="ln" d="M300 154 V192 M290 182 L300 196 L310 182" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g id="iterate">
    <rect class="card" x="30" y="200" width="540" height="120" rx="14" stroke-width="2"/>
    <text x="54" y="240" class="mono fg" font-size="20">iter_messages</text>
    <text x="54" y="274" class="sans muted" font-size="20">newest first</text>
    <text x="54" y="304" class="sans muted" font-size="20">1 s between requests</text>
  </g>
  <path class="ln" d="M510 324 V512 M500 502 L510 516 L520 502" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g id="flood">
    <path class="lnw" d="M150 324 V372 M140 362 L150 376 L160 362" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="lnw" d="M250 376 V328 M240 338 L250 324 L260 338" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect class="warn" x="30" y="380" width="420" height="110" rx="14" stroke-width="2"/>
    <text x="54" y="418" class="mono acc" font-size="20">FloodWaitError</text>
    <text x="54" y="448" class="sans fg" font-size="20">sleep the seconds it asks for,</text>
    <text x="54" y="476" class="sans fg" font-size="20">resume the same iterator</text>
  </g>

  <g id="decide">
    <rect class="card" x="30" y="520" width="540" height="120" rx="14" stroke-width="2"/>
    <text x="54" y="560" class="mono fg" font-size="20">scan_decision</text>
    <text x="54" y="594" class="sans muted" font-size="20">per message,</text>
    <text x="54" y="624" class="sans muted" font-size="20">pure function</text>
    <rect class="take" x="30" y="656" width="540" height="48" rx="10"/>
    <text x="50" y="687" class="mono pri" font-size="20">TAKE <tspan class="fg">→ mapper(msg)</tspan></text>
    <rect class="skip" x="30" y="714" width="540" height="48" rx="10"/>
    <text x="50" y="745" class="mono muted" font-size="20">SKIP <tspan class="fg">date ≥ until</tspan></text>
    <rect class="stop" x="30" y="772" width="540" height="52" rx="10"/>
    <text x="50" y="805" class="mono acc" font-size="20">STOP <tspan class="fg">&lt; since · max_scan</tspan></text>
  </g>

  <text x="30" y="870" class="sans muted" font-size="19">first run: since bounds the window;</text>
  <text x="30" y="900" class="sans muted" font-size="19">later runs: min_id skips what you saw</text>
</svg>
