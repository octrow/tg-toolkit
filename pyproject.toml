[project]
name = "tg-toolkit"
version = "0.1.0"
description = "Telethon user-session reading (incremental, FloodWait-safe), Telegram-Desktop-export conversion, and dependency-free Bot API push"
requires-python = ">=3.12"
dependencies = ["telethon>=1.36"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tg_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
