[project]
name = "tg-toolkit"
version = "0.1.0"
description = "Telethon user-session reading (incremental, FloodWait-safe), Telegram-Desktop-export conversion, and dependency-free Bot API push"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniil Petrov" }]
keywords = ["telegram", "telethon", "telegram-bot", "bot-api", "telegram-export", "floodwait"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Chat",
]
requires-python = ">=3.12"
dependencies = ["telethon>=1.36"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/octrow/tg-toolkit"
Issues = "https://github.com/octrow/tg-toolkit/issues"
Changelog = "https://github.com/octrow/tg-toolkit/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tg_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
